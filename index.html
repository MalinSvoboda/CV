<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malin Svoboda — CV</title>
  <style>
    :root {
      --bg: #0f172a;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .card {
      text-align: center;
      max-width: 32rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
      margin-bottom: 0.75rem;
    }
    h1 span { color: var(--accent); }
    p {
      color: var(--muted);
      font-size: 1.125rem;
      line-height: 1.6;
    }
    .tag {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to <span>Malin Svoboda's</span> CV</h1>
    <p>This site is just getting started — a proper CV is on its way.</p>
    <span class="tag">Coming soon</span>
  </main>
</body>
</html>
